<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: X-bounce 3s linear infinite,
                        Y-bounce 0.75s ease-out infinite alternate;
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }

        @keyframes X-bounce {
           from{
            left: 0%;
           }
           to {
            left:90%;
           }
        }
        @keyframes Y-bounce{
            from{
                bottom: 0%;
            }
            to{
                bottom: 80%;
            }
        }
        
    </style>
</head>

<body>
    <div class="container">

        <div class="box">
        </div>
    </div>
</body>

</html>
