<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grids</title>
    <style>
        .container{
            border: 2px solid black;
            display: grid;
            height:100vh;
            width: 80vw;
            /* grid-template-columns: [pehla] 120px [doosra] 100px [t];
            grid-template-rows: 100px 100px 100px; */
            grid-template-columns: repeat(4,80px);
            gap: 10px;
            column-gap: 44px;
            justify-items: center;
            align-items: center;
        }
        .items{
            border: 2px solid red;
            height: 55px;
            width: 55px
        }
 
        /* .items1{
            grid-row: 1/2;
            grid-column: 1/2;
        }
        .items4{
            grid-row: 1/2;
            grid-column: doosra/t;
        } */
    </style>
</head>
<body>
    <div class="container">
        <div class="items items1">1</div>
        <div class="items items2">2</div>
        <div class="items items3">3</div>
        <div class="items items4">4</div>
        <div class="items items5">5</div>
    </div>
</body>
</html>
