<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Generator</title>
    <style>
        .container{
            height: 100vh;
            align-content: center;
        }
        .box{
            background-color: rgb(0, 0, 0);
            height: 150px;
            border-radius: 15px;
            display: flex;
            
        }
        .img{
            margin: 2%;
            background-image: url(https://i.ytimg.com/vi/KtL-SQ20Q0s/hqdefault.jpg?sqp=-oaymwEbCKgBEF5IVfKriqkDDggBFQAAiEIYAXABwAEG&rs=AOn4CLABJhdIBqlilwXKzJqa6StynbJT4Q);
            height : 93px;
            width: 167px;
            display:flex;
            justify-content: flex-end;
            align-items: flex-end;
            border-radius: 10px;
            margin-right: 0;
        }
        .time{
            margin: 5px;
            background-color: black;
            color: white;
            padding: 2px 3px;
            border-radius: 5px;
            opacity: 75%;
        }
        .title{
            color: white;
            margin: 2% 0;
            margin-left: 10px;
            
        }
        .chann{
            color:rgb(160, 160, 160);
            font-size: small;
        }

    </style>
</head>
<body>
    <div class="container">
   
    </div>
    <script src="card_gen.js"></script>
</body>
</html>
