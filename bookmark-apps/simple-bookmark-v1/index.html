<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bookmark App (v1)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    form { margin-bottom: 20px; }
    input { padding: 8px; margin-right: 10px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { margin: 10px 0; }
    a { color: #0066cc; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🔖 Favorite Bookmarks</h2>
  
  <!-- Form to collect bookmark info -->
  <form id="bookmarkForm">
    <input type="text" id="siteName" placeholder="Website Name" required>
    <input type="url" id="siteUrl" placeholder="https://example.com" required>
    <button type="submit">Save Bookmark</button>
  </form>

  <!-- Container where links will show up -->
  <ul id="bookmarkList"></ul>

  <script>
    const form = document.getElementById('bookmarkForm');
    const list = document.getElementById('bookmarkList');

    // 1. Handle form submission
    form.addEventListener('submit', function(e) {
      e.preventDefault(); // Stop page from refreshing
      
      const name = document.getElementById('siteName').value;
      const url = document.getElementById('siteUrl').value;

      // 2. Create the HTML Elements
      const li = document.createElement('li');
      const a = document.createElement('a');
      
      // 3. Set properties and href attribute
      a.href = url;
      a.textContent = name;
      a.target = "_blank"; // Opens link in a new tab

      // 4. Inject into the DOM
      li.appendChild(a);
      list.appendChild(li);

      // 5. Reset inputs
      form.reset();
    });
  </script>
</body>
</html>
