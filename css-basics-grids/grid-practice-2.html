<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grids</title>
    <style>
        .container{
            border: 2pxx solid black;
            display: grid;
            grid-template-areas: "nav nav nav"
                                 "side article article";}
                                
        .items{
            border: 2px solid red;
            /* height: 55px;
            width: 55px */
        }
 
        .items1{
            grid-area: nav;
        }
        .items4{
            grid-area:article;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items items1">1</div>
        <div class="items items2">2</div>
        <div class="items items3">3
        </div>
        <div class="items items4">4</div>
        <div class="items items5">5</div>
    </div>
</body>
</html>
